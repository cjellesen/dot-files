---
- name: "Python | Installing the UV package (Package/virtualenv manager)"
  community.general.pacman:
    name: uv
    update_cache: true
    state: present

- name: "Python | Installing the Ruff package (Linter and code formatter)"
  command: uv tool install ruff

- name: "Python | Installing the Pyrefly LSP"
  command: uv tool install pyrefly
