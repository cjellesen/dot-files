---
- name: "Dotnet | Installing the generic driver for the .NET Core CLI"
  community.general.pacman:
    name: dotnet-host
    update_cache: true
    state: present

- name: "Dotnet | Installing the newest .NET SDK"
  community.general.pacman:
    name: dotnet-sdk
    state: present

- name: "Dotnet | Installing the newest .NET runtime"
  community.general.pacman:
    name: dotnet-runtime
    state: present

- name: "Dotnet | Installing the newest .NET runtime targeting pack"
  community.general.pacman:
    name: dotnet-targeting-pack
    state: present

- name: "Dotnet | Installing the newest .NET ASP .NET runtime"
  community.general.pacman:
    name: aspnet-runtime
    state: present

- name: "Dotnet | Installing the newest .NET ASP .NET targeting pack"
  community.general.pacman:
    name: aspnet-targeting-pack
    state: present

- name: "Dotnet | Installing Entity Framework Core (DB utility tool)"
  command: dotnet tool install --global dotnet-ef

- name: "Dotnet | Installing Roslyn (Language Server Protocol)"
  command: dotnet tool install --global roslyn-language-server --prerelease

- name: "Dotnet | Installing the Microsoft Credential Provider (For Azure Artifacts)"
  command: dotnet tool install --global Microsoft.Artifacts.CredentialProvider.NuGet.Tool

- name: "Dotnet | Installing csharpier"
  command: dotnet tool install --global csharpier

- name: "Dotnet | Requesting github API for latest Netcoredbg debugger"
  ansible.builtin.uri:
    url: "https://api.github.com/repos/Samsung/netcoredbg/releases/latest"
    method: GET
    status_code: 200
    body_format: json
    return_content: true
  register: json_reponse

- name: "Dotnet | Downloading latest Netcoredbg debugger"
  ansible.builtin.get_url:
    url: "https://github.com/Samsung/netcoredbg/releases/download/{{ json_reponse.json.tag_name }}/netcoredbg-linux-amd64.tar.gz"
    dest: /tmp
    mode: 0644
    force: true

- name: "Dotnet | Remove any current Netcoredbg installs"
  ansible.builtin.file:
    path: /opt/netcoredbg
    state: absent
  become: true

- name: "Dotnet | Unpacking Netcoredbg"
  ansible.builtin.unarchive:
    src: /tmp/netcoredbg-linux-amd64.tar.gz
    dest: /opt
  become: true

- name: "Dotnet | Removing downloaded netcoredbg file from Github"
  ansible.builtin.file:
    path: /tmp/netcoredbg-linux-amd64.tar.gz
    state: absent
  become: true

- name: "Dotnet | Creating a symbolic link for Netcoredbg"
  ansible.builtin.file:
    src: /opt/netcoredbg/netcoredbg
    dest: /usr/bin/netcoredbg
    state: link
  become: true

