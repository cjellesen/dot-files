---
- name: "Docker | Installing Docker"
  community.general.pacman:
    name: docker
    update_cache: true
    state: present

- name: "Docker | Installing Docker Compose"
  community.general.pacman:
    name: docker-compose
    update_cache: true
    state: present

- name: "Docker | Enable service"
  ansible.builtin.systemd:
    enabled: true
    name: docker
    state: started

- name: "Docker | Add to group"
  ansible.builtin.user:
    append: true
    groups: docker
    name: "{{ ansible_facts['env']['USER'] }}"

- name: "Docker | Ensure docker data directory exists"
  ansible.builtin.file:
    path: "{{  ansible_facts['user_dir'] }}/.local/lib/docker"
    state: directory
    mode: "0710"

- name: "Docker | Ensure etc/docker directory exists"
  ansible.builtin.file:
    path: "/etc/docker"
    state: directory
    mode: "0710"

- name: "Docker | Copy daemon.json"
  ansible.builtin.template:
    dest: "/etc/docker/daemon.json"
    src: "daemon.json"
    mode: "0644"
  notify: restart_docker
